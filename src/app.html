<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="robots" content="noindex" />
    <!-- Google Tag Manager, as reliefweb.int loads it (its /gtm-load.js, inlined):
         GTM-TLKXSWT (managed by OCHA TSS) and GTM-LQCS (UN Secretariat, managed by
         OICT). Not loaded on localhost, so local work and checks are not counted. -->
    <script>
      if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        ['GTM-TLKXSWT', 'GTM-LQCS'].forEach(function (id) {
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s);
            j.async = true;
            j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + '&gtm_auth=&gtm_preview=&gtm_cookies_win=x';
            f.parentNode.insertBefore(j, f);
          })(window, document, 'script', 'dataLayer', id);
        });
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TLKXSWT&gtm_auth=&gtm_preview=&gtm_cookies_win=x" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-LQCS&gtm_auth=&gtm_preview=&gtm_cookies_win=x" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div>%sveltekit.body%</div>
  </body>
</html>
